name: Validate GitHub Pages build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Run application and corpus regressions
        run: |
          node tests/core-tests.js
          node tests/keyboard-shortcut-tests.js
      - name: Build allowlisted static site
        run: python scripts/build-pages.py --output _site
      - name: Test the production build under a repository subpath
        run: python tests/pages-deployment-check.py --site _site
      - name: Upload only the validated runtime files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
